<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Pagamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="../nav_bar/nav.css">
    <link rel="stylesheet" href="pagamentos.css">
    <link rel="shortcut icon" href="../../image/favicon.ico" type="image/x-icon">

    <!-- Biblioteca SheetJS para exportar Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

    <div id="nav-placeholder"></div>

    <main class="container py-4">
        <div class="bg-white rounded-4 shadow-sm p-4">

            <!-- Cabeçalho com os botões Exportar Geral e Novo Pagamento -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="text-primary-dark fw-bold mb-0 me-3">Pagamentos</h3>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-success rounded-pill px-4 fw-bold" onclick="exportarExcelGeral()">
                        <i class="bi bi-file-earmark-excel"></i> Exportar Geral
                    </button>
                    <button class="btn btn-outline-danger rounded-pill px-4 fw-bold" data-bs-toggle="modal"
                        data-bs-target="#modalNovoPagamento">
                        <i class="bi bi-plus-lg"></i> Novo Pagamento
                    </button>
                </div>
            </div>

            <!-- Barra de Filtros -->
            <div class="filter-bar d-flex align-items-center mb-4 flex-wrap gap-2">
                <div class="fw-bold text-primary-dark me-3 fs-5">FILTRO</div>

                <div class="d-flex flex-grow-1 align-items-center gap-3 flex-wrap">
                    <div class="d-flex align-items-center">
                        <label class="text-danger fw-bold me-2 small">EMPENHO</label>
                        <input type="text" id="filtroEmpenho"
                            class="form-control form-control-sm border-danger-subtle filter-input"
                            placeholder="buscar nº NE">
                    </div>
                    <div class="d-flex align-items-center">
                        <label class="text-danger fw-bold me-2 small">FORNECEDOR</label>
                        <input type="text" id="filtroFornecedor"
                            class="form-control form-control-sm border-danger-subtle filter-input"
                            placeholder="buscar fornecedor">
                    </div>
                    <div class="d-flex align-items-center">
                        <label class="text-danger fw-bold me-2 small">STATUS</label>
                        <select id="filtroStatus"
                            class="form-select form-select-sm border-danger-subtle filter-input text-secondary">
                            <option value="">Selecione</option>
                            <option value="Pago">Pago</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Atrasado">Atrasado</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-center">
                        <label class="text-danger fw-bold me-2 small">ANO</label>
                        <select id="filtroAno"
                            class="form-select form-select-sm border-danger-subtle filter-input text-secondary">
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary rounded-pill btn-sm px-3 fw-bold"
                        onclick="limparFiltros()">LIMPAR</button>
                    <button class="btn btn-primary rounded-pill btn-sm px-3 fw-bold bg-dark-blue border-0"
                        onclick="aplicarFiltros()">APLICAR</button>
                </div>
            </div>

            <!-- Tabela -->
            <div class="table-responsive">
                <table class="table table-borderless align-middle custom-table text-center">
                    <thead>
                        <tr class="text-danger text-uppercase">
                            <th>Nº Pag</th>
                            <th>Nº Empenho</th>
                            <th>Fornecedor</th>
                            <th class="text-start">Descrição</th>
                            <th>Vencimento</th>
                            <th>Valor (R$)</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPagamentosBody">
                    </tbody>
                </table>
            </div>

            <!-- Container da Paginação -->
            <div id="paginacaoContainer" class="d-flex justify-content-center mt-4"></div>

        </div>
    </main>

    <!-- Modal de Visualização -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewModalLabel" aria-hidden="true">
    </div>

    <!-- Modal de Novo Pagamento -->
    <div class="modal fade" id="modalNovoPagamento" tabindex="-1" aria-labelledby="modalNovoPagamentoLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header bg-danger text-white rounded-top-4">
                    <h5 class="modal-title fw-bold" id="modalNovoPagamentoLabel">
                        <i class="bi bi-plus-circle me-2"></i> Lançar Novo Pagamento
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formNovoPagamento">
                        <div class="row mb-3">
                            <div class="col-12">
                                <label for="novoFornecedor" class="fw-bold text-primary-dark">Fornecedor</label>
                                <select class="form-select bg-light" id="novoFornecedor" required>
                                    <!-- Opções de fornecedores serão carregadas aqui -->
                                </select>
                            </div>
                        </div>

                        <!-- Container para o select de E-Fiscos (inicialmente oculto) -->
                        <div class="mb-3" id="container-select-efisco" style="display: none;">
                            <label for="selectEfisco" class="form-label fw-bold text-primary-dark">Selecione o Item
                                (E-Fisco)</label>
                            <select id="selectEfisco" class="form-select"></select>
                        </div>

                        <!-- Container para os detalhes do item (inicialmente oculto) -->
                        <div id="container-detalhes-item" style="display: none;">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="fw-bold text-primary-dark">Nota de Empenho</label>
                                    <input type="text" class="form-control bg-light" id="novoEmpenho" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="fw-bold text-primary-dark">Código E-Fisco</label>
                                    <input type="text" class="form-control bg-light" id="novoEfisco" readonly>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold text-primary-dark">Descrição do Item</label>
                            <input type="text" class="form-control bg-light" id="novoDescricao"
                                placeholder="Ex: Impressora Departamental" required>
                        </div>

                        <!-- Linha atualizada com o campo de Nota Fiscal -->
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="fw-bold text-primary-dark">Vencimento</label>
                                <input type="date" class="form-control bg-light" id="novoVencimento" required>
                            </div>
                            <div class="col-md-3">
                                <label class="fw-bold text-primary-dark">Valor (R$)</label>
                                <input type="text" class="form-control bg-light" id="novoValor" placeholder="1500,00"
                                    required>
                            </div>
                            <div class="col-md-3">
                                <label class="fw-bold text-primary-dark">Nota Fiscal</label>
                                <input type="number" class="form-control bg-light border-danger" id="novoNotaFiscal"
                                    placeholder="Nº da NF">
                            </div>
                            <div class="col-md-3">
                                <label class="fw-bold text-primary-dark">Status Inicial</label>
                                <select class="form-select bg-light" id="novoStatus">
                                    <option value="Pendente">Pendente</option>
                                    <option value="Pago">Pago</option>
                                    <option value="Atrasado">Atrasado</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary rounded-pill px-4"
                        data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-bold"
                        onclick="salvarNovoPagamento()">Salvar Lançamento</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../nav_bar/nav.js"></script>
    <script src="pagamentos.js"></script>
</body>

</html>
