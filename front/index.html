<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Portal
        GERENCIAMENTO E ACOMPANHAMENTO DE LICITAÇÕES</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="assets/image/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/pages/login/login.css">
</head>

<body>

    <section id="loading-screen" aria-label="Tela de carregamento do sistema">
        <div class="heart-logo" aria-hidden="true"></div>
    </section>

    <main id="login-screen" class="container-fluid p-0">
        <div class="row g-0">

            <section class="col-md-6 d-none d-md-block login-bg" aria-label="Fundo decorativo da instituição">
                <div class="overlay-esfumacado">
                    <h1 class="portal-titulo">Portal</h1>
                    <p class="portal-subtitulo">GERENCIAMENTO E ACOMPANHAMENTO Processos</p>
                </div>
            </section>

            <section class="col-md-6 login-form-container" aria-labelledby="titulo-login">
                <div class="w-100 mx-auto login-box-container">
                    <h1 id="titulo-login" class="login-title text-center">Login</h1>

                    <form id="form-acesso">
                        <div class="mb-3">
                            <label for="inputCpf" class="form-label">CPF</label>
                            <input type="text" class="form-control apenas-numeros" id="inputCpf" maxlength="11"
                                placeholder="Digite o seu CPF" required>
                        </div>

                        <div class="mb-2">
                            <label for="inputSenha" class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0" id="inputSenha"
                                    placeholder="Digite sua senha" required>
                                <button class="btn border border-start-0" type="button" id="btnToggleSenha">
                                    <i class="bi bi-eye" id="iconeSenha"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login">Acessar</button>
                    </form>

                    <footer id="rodape-login">
                        <img src="assets/image/logo.png" alt="Logo PROCAPE" aria-hidden="true" id="logo-canto-inferior">
                    </footer>

                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/pages/login/login.js"></script>
</body>

</html>
